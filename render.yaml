# StyleTrail on Render's free plan: one web service runs the website and the API.
#   Database: a free Neon Postgres (doesn't expire) – paste its connection string as DATABASE_URL.
#   Price refresh: .github/workflows/price-refresh.yml (free GitHub Actions schedule).
services:
  - type: web
    name: styletrail
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon connection string: postgresql://user:pass@host/db?sslmode=require
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_SERP_ZONE
        sync: false
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true  # copy into GitHub secrets for the refresh workflow
      - key: COUNTRY
        value: in
      - key: LLM_PROVIDER
        value: none
      - key: REFRESH_LIMIT
        value: "150"
      - key: MAX_PRODUCT_PAGES
        value: "25"
